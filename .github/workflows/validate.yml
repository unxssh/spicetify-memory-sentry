name: Validate Memory Sentry
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  javascript-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate package and source syntax
        run: node tests/validate-package.js

  rust-policy-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test platform-independent Rust policy
        run: cargo test --manifest-path native/rust/Cargo.toml --locked

  windows-setup-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - name: Validate JavaScript package
        run: node tests/validate-package.js
      - name: Run Rust tests on Windows
        run: cargo test --manifest-path native/rust/Cargo.toml --locked
      - name: Build native companion for Windows x64
        run: cargo build --release --manifest-path native/rust/Cargo.toml --target x86_64-pc-windows-msvc --locked
      - name: Verify safe binary commands
        shell: pwsh
        run: |
          $binary = "target\x86_64-pc-windows-msvc\release\memory-sentry-native.exe"
          & $binary --version
          if ($LASTEXITCODE -ne 0) { throw "The companion version command failed." }
          & $binary --self-test
          if ($LASTEXITCODE -ne 0) { throw "The companion self-test failed." }
      - name: Install Inno Setup 6
        shell: pwsh
        run: choco install innosetup --yes --no-progress
      - name: Build per-user Setup EXE and portable package
        shell: pwsh
        run: .\scripts\build-package.ps1 -Version "0.3.0-pre.2"
      - name: Upload preview installer and package
        uses: actions/upload-artifact@v4
        with:
          name: MemorySentry-preview
          if-no-files-found: error
          path: |
            dist/MemorySentrySetup-*.exe
            dist/MemorySentrySetup-*.exe.sha256
            dist/MemorySentry-*-windows-x64.zip
            dist/MemorySentry-*-windows-x64.zip.sha256
