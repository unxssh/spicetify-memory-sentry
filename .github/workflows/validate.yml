name: Validate Memory Sentry
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  javascript-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate package and source syntax
        run: node tests/validate-package.js

  rust-policy-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test platform-independent Rust policy
        run: cargo test --manifest-path native/rust/Cargo.toml --locked

  rust-windows-target-check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Compile Rust companion for Windows 10/11 x64
        run: cargo check --release --manifest-path native/rust/Cargo.toml --target x86_64-pc-windows-msvc --locked
