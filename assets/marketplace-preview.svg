  <text x="78" y="505" fill="#ecf3f2" font-family="Segoe UI,Arial,sans-serif" font-size="11" font-weight="600">Main process</text><text x="350" y="505" fill="#dce7e8" font-family="Segoe UI,Arial,sans-serif" font-size="11">5.2%</text><text x="452" y="505" fill="#dce7e8" font-family="Segoe UI,Arial,sans-serif" font-size="11">23.4 MB</text><text x="591" y="505" fill="#dce7e8" font-family="Segoe UI,Arial,sans-serif" font-size="11">36 MB</text>
  <text x="78" y="536" fill="#ecf3f2" font-family="Segoe UI,Arial,sans-serif" font-size="11" font-weight="600">Renderer process</text><text x="350" y="536" fill="#dce7e8" font-family="Segoe UI,Arial,sans-serif" font-size="11">1.1%</text><text x="452" y="536" fill="#dce7e8" font-family="Segoe UI,Arial,sans-serif" font-size="11">19.0 MB</text><text x="591" y="536" fill="#dce7e8" font-family="Segoe UI,Arial,sans-serif" font-size="11">20 MB</text>
  <text x="78" y="567" fill="#ecf3f2" font-family="Segoe UI,Arial,sans-serif" font-size="11" font-weight="600">Audio service</text><text x="350" y="567" fill="#dce7e8" font-family="Segoe UI,Arial,sans-serif" font-size="11">2.4%</text><text x="452" y="567" fill="#dce7e8" font-family="Segoe UI,Arial,sans-serif" font-size="11">3.8 MB</text><rect x="589" y="552" width="87" height="21" rx="10" fill="#173a2c"/><text x="608" y="566" fill="#46eca0" font-family="Segoe UI,Arial,sans-serif" font-size="9" font-weight="800">EXCLUDED</text>
  <text x="62" y="605" fill="#8ea2aa" font-family="Segoe UI,Arial,sans-serif" font-size="10">UI artwork is illustrative, not a performance benchmark.</text>
</g>
