<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">Memory Sentry for Spotify Desktop</title>
<desc id="desc">Marketplace preview of the Memory Sentry dashboard and stylized Task Manager snapshots showing Spotify process memory at different moments. No before-and-after performance claim is implied.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#070c10"/><stop offset=".56" stop-color="#0a1719"/><stop offset="1" stop-color="#06100d"/></linearGradient>
  <linearGradient id="green" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#00ef8b"/><stop offset="1" stop-color="#00a86b"/></linearGradient>
  <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#1a2228"/><stop offset="1" stop-color="#10171c"/></linearGradient>
  <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse"><path d="M42 0H0V42" fill="none" stroke="#1a4034" stroke-width="1" opacity=".34"/></pattern>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity=".5"/></filter>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/><rect width="1200" height="675" fill="url(#grid)" opacity=".55"/>
<path d="M0 560 C160 470 220 640 370 540 S620 500 760 574 S1010 630 1200 500" fill="none" stroke="#00d77b" stroke-width="2" opacity=".38"/>
<circle cx="1100" cy="72" r="170" fill="#00c878" opacity=".055"/><circle cx="1090" cy="70" r="112" fill="none" stroke="#00e78b" stroke-width="2" opacity=".28"/>
<g transform="translate(42 32)">
  <rect width="46" height="46" rx="13" fill="#0b3026" stroke="#17e58a" stroke-width="1.5"/>
  <path d="M8 25h9l6-11 6 19 6-13h4" fill="none" stroke="#50ffae" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
</g>
<text x="102" y="65" fill="#f4f8f8" font-family="Segoe UI,Arial,sans-serif" font-size="33" font-weight="800" letter-spacing="1.4">MEMORY SENTRY</text>
<text x="44" y="99" fill="#b1c3c3" font-family="Segoe UI,Arial,sans-serif" font-size="17">Adaptive working-set management for Spotify Desktop</text>
<rect x="44" y="117" width="214" height="33" rx="16.5" fill="#102d24" stroke="#266f50"/>
<circle cx="62" cy="133.5" r="5.2" fill="#1fe68b"/><text x="77" y="138" fill="#c7ffe2" font-family="Segoe UI,Arial,sans-serif" font-size="11.5" font-weight="800" letter-spacing=".6">WINDOWS 10 / 11</text>
