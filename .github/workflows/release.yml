name: Build and publish Memory Sentry
on:
  push:
    tags:
      - 'v*'
permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - name: Ensure release tag matches Cargo version
        shell: pwsh
        run: |
          $cargo = Get-Content native/rust/Cargo.toml -Raw
          if ($cargo -notmatch '(?m)^version\s*=\s*"([^"]+)"') { throw "Could not read Cargo version." }
          $cargoVersion = $Matches[1]
          $tagVersion = $env:GITHUB_REF_NAME.TrimStart('v')
          if ($tagVersion -ne $cargoVersion) { throw "Release tag $tagVersion does not match Cargo version $cargoVersion." }
      - name: Run Rust tests
        run: cargo test --manifest-path native/rust/Cargo.toml --locked
      - name: Build native Windows x64 companion
        run: cargo build --release --manifest-path native/rust/Cargo.toml --target x86_64-pc-windows-msvc --locked
      - name: Validate JavaScript and package metadata
        run: node tests/validate-package.js
      - name: Install Inno Setup 6
        shell: pwsh
        run: choco install innosetup --yes --no-progress
      - name: Build Setup EXE, portable ZIP and checksums
        shell: pwsh
        run: .\scripts\build-package.ps1 -Version $env:GITHUB_REF_NAME.TrimStart('v')
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          # Version 0.x remains an explicitly experimental prerelease until the required Windows desktop test matrix is complete.
          prerelease: ${{ contains(github.ref_name, '-pre') || startsWith(github.ref_name, 'v0.') }}
          make_latest: false
          files: |
            dist/MemorySentrySetup-*.exe
            dist/MemorySentrySetup-*.exe.sha256
            dist/MemorySentry-*-windows-x64.zip
            dist/MemorySentry-*-windows-x64.zip.sha256
