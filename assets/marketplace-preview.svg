  <text x="110" y="204" fill="#eef6f3" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="700">Memory Sentry</text>
  <rect x="613" y="187" width="145" height="25" rx="12.5" fill="#173c2d" stroke="#2b7754"/>
